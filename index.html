<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>足球 AI 工作台</title><style>body{background:#101827;color:#f1f5f9;font:16px system-ui;margin:0;padding:20px}main{max-width:900px;margin:auto}textarea{box-sizing:border-box;width:100%;height:250px;background:#1e293b;color:white;padding:12px;border:1px solid #64748b;border-radius:10px}button{background:#4adeb0;border:0;padding:12px;margin:6px;border-radius:8px;font-weight:bold}canvas{max-width:100%;width:350px}section{display:flex;gap:18px;flex-wrap:wrap}section>div{flex:1;min-width:280px}pre{white-space:pre-wrap}</style><main><h1>足球 AI 工作台</h1><p>免費測試版｜人工匯入已查證的賽事資料，檢查格式、編輯文案及製作圖片。尚未連接即時球探網或 AI。</p><button id="sample">載入資料格式</button><input type="file" id="file" accept=".json"><textarea id="data" placeholder="在此貼入賽事 JSON"></textarea><div><button id="check">檢查資料</button><button id="make">產生文案與圖片</button><button id="save">下載資料</button></div><pre id="msg"></pre><section><div><canvas id="poster" width="1080" height="1920"></canvas><button id="png">下載 PNG</button></div><div><h2>小紅書文案</h2><textarea id="copy"></textarea><button id="copytext">複製文案</button></div></section></main><script>
const E=id=>document.getElementById(id),c=E('poster'),g=c.getContext('2d');E('file').onchange=async e=>E('data').value=await e.target.files[0].text();E('sample').onclick=()=>E('data').value=JSON.stringify({source:"",verified_at:"",matches:[{league:"",home:"",away:"",kickoff:"2026-11-15T20:00",source_url:"",odds_checked_at:"",asian_open:"",asian_live:"",euro_live:"",ou_open:"",ou_live:"",analysis:"",trend:"大 2.5",scores:["1-0","2-1","1-1"]}]},null,2);
function read(){let d=JSON.parse(E('data').value),errors=[];if(!d.source||!d.verified_at)errors.push("缺少資料來源或驗證時間");if(!Array.isArray(d.matches)||d.matches.length<3||d.matches.length>5)errors.push("賽事必須為 3～5 場");(d.matches||[]).forEach((m,i)=>{for(let k of ['league','home','away','kickoff','source_url','odds_checked_at','asian_open','asian_live','euro_live','ou_open','ou_live','analysis','trend'])if(!m[k])errors.push("第"+(i+1)+"場缺少 "+k);if(!/^https:\/\//.test(m.source_url||""))errors.push("第"+(i+1)+"場來源網址不合格式");if(!Array.isArray(m.scores)||m.scores.length!==3||m.scores.some(s=>!/^\d{1,2}-\d{1,2}$/.test(s)))errors.push("第"+(i+1)+"場比分不合格式");else if(['主勝','客勝','平局'].includes(m.trend))errors.push("第"+(i+1)+"場請改用亞盤或大小球方向")}});E('msg').textContent=errors.length?errors.join('\n'):'格式檢查通過（不代表外部資料已查證）';return errors.length?null:d}
E('check').onclick=()=>{try{read()}catch(e){E('msg').textContent=e.message}};function line(t,x,y,size,color='#fff'){g.fillStyle=color;g.font=size+'px sans-serif';g.fillText(t,x,y)}
E('make').onclick=()=>{try{let d=read();if(!d)return;g.fillStyle='#0d1829';g.fillRect(0,0,1080,1920);line('足球赛事前瞻',65,115,70);d.matches.forEach((m,i)=>{let step=1450/d.matches.length,y=220+i*step;g.fillStyle='#22334a';g.fillRect(45,y,990,step-15);line((m.league+'  '+m.kickoff.slice(5,16)).slice(0,32),75,y+60,30,'#5eeac2');line((m.home+' VS '+m.away).slice(0,24),75,y+120,38);line('比分 '+m.scores.join(' / '),75,y+175,32);line('趋势 '+m.trend,75,y+225,34,'#ffda8b')});line('仅供赛事交流，请理性看待',75,1830,30,'#b4c6d9');E('copy').value='今晚足球前瞻｜'+d.matches.length+'场精选\n\n'+d.matches.map(m=>'【'+m.league+'】'+m.home+' vs '+m.away+'\n比分参考：'+m.scores.join(' / ')+'\n趋势参考：'+m.trend+'\n'+m.analysis).join('\n\n')+'\n\n仅供赛事交流，不构成投注建议。\n#足球 #赛事前瞻 #足球分析'}catch(e){E('msg').textContent=e.message}};
function dl(name,b){let u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}E('png').onclick=()=>c.toBlob(b=>dl('football.png',b));E('save').onclick=()=>dl('matches.json',new Blob([E('data').value],{type:'application/json'}));E('copytext').onclick=()=>navigator.clipboard.writeText(E('copy').value);
</script></html>
