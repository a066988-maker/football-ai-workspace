name: One-match public NowScore diagnostic
on:
  push:
    branches: [diagnostics/titan-same-match-20261128]
    paths: ['.github/workflows/titan-same-match.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet playwright
      - name: Compare public kickoff pages in the hosted runner
        run: |
          PYTHONPATH=scripts python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          import json, re, shutil
          from collections import Counter
          from urllib.parse import urlparse
          from playwright.sync_api import sync_playwright, TimeoutError
          import collect
          urls = {
              "euro": "https://m.zhiyunsports.com/1x2/3003966.htm",
              "asian": "https://m.zhiyunsports.com/Handicap/3003966.htm",
              "ou": "https://m.zhiyunsports.com/OverUnder/3003966.htm",
          }
          def check(item):
              kind, url = item
              result = {"kind": kind, "fixture": "3003966"}
              with sync_playwright() as p:
                  browser = p.chromium.launch(executable_path=shutil.which("google-chrome") or shutil.which("chromium"), args=["--no-sandbox"])
                  try:
                      page = browser.new_page()
                      response_types, request_errors = Counter(), Counter()
                      def mark_response(r):
                          host = urlparse(r.url).hostname or ""
                          if host.endswith(".zhiyunsports.com"):
                              response_types[(host, r.request.resource_type, r.status)] += 1
                      def mark_error(r):
                          host = urlparse(r.url).hostname or ""
                          if host.endswith(".zhiyunsports.com"):
                              request_errors[(host, r.resource_type, r.failure)] += 1
                      page.on("response", mark_response)
                      page.on("requestfailed", mark_error)
                      response = page.goto(url, wait_until="domcontentloaded", timeout=15000)
                      result["http"] = response.status if response else None
                      if result["http"] != 200:
                          return result
                      result["expected_title"] = bool(re.search(r"曼彻斯特联|曼聯",page.title())) and bool(re.search(r"布伦特福德|賓福特",page.title()))
                      if not result["expected_title"]:
                          return result
                      for phase in ("page_ready", "after_5s"):
                          _, diag = collect.inspect_detail_row(page, kind)
                          result[phase] = diag
                          if phase == "page_ready":
                              if diag["outcome"] == "registration_wall":
                                  break
                              page.wait_for_timeout(5000)
                      if result.get("page_ready", {}).get("outcome") != "registration_wall" and result.get("after_5s", {}).get("outcome") != "registration_wall":
                          result["visible_dom"] = page.evaluate("""() => {
                              const visible = el => !!(el.offsetWidth || el.offsetHeight || el.getClientRects().length) && getComputedStyle(el).visibility === 'visible';
                              const body = document.body?.innerText || '';
                              const counts = {visible_rows: 0, price_shaped_rows: 0,
                                 ready_state: document.readyState, visible_text_length: body.trim().length,
                                 total_tables: document.querySelectorAll('table').length,
                                 visible_tables: [...document.querySelectorAll('table')].filter(visible).length,
                                 visible_market_labels: /初盘|初盤|即时|即時|指数|指數/.test(body),
                                 visible_access_prompt: /登录|登陆|登入|註冊|注册|查看权限|查看權限|人机验证|禁止访问|just a moment/i.test(body),
                                 visible_fixture_names: /曼彻斯特联|曼聯/.test(body) && /布伦特福德|賓福特/.test(body),
                                 visible_access_labels: body.split(String.fromCharCode(10)).map(x => x.trim()).filter(x => /登录|登陆|登入|註冊|注册|权限|權限|权益|權益|访客|訪客|会员|會員|验证|驗證|限制|地区|地區|不支持|不支援|not available|forbidden/i.test(x)).slice(0,8).map(x => x.slice(0,100))
                              };
                              for (const row of document.querySelectorAll('tr')) {
                                  if (!visible(row)) continue;
                                  counts.visible_rows++;
                                  const cells = [...row.querySelectorAll(':scope > td')].filter(visible).map(cell => cell.innerText.trim());
                                  if (cells.join(' ').split(/\s+/).filter(t => /^\\d{1,2}\\.\\d{1,4}$/.test(t)).length >= 3) counts.price_shaped_rows++;
                              }
                              return counts;
                          }""")
                  except TimeoutError:
                      result["error"] = "navigation_or_render_timeout"
                  finally:
                      result["http_types"] = [[*k, v] for k, v in response_types.items()]
                      result["request_errors"] = [[*k, v] for k, v in request_errors.items()]
                      browser.close()
              return result
          with ThreadPoolExecutor(max_workers=3) as workers:
              for outcome in workers.map(check, urls.items()):
                  print(json.dumps(outcome, ensure_ascii=False))
          PY
