name: Titan007 match detail diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Inspect up to three match detail pages
        run: python scripts/titan_details.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan-details-diagnostic
          path: output/titan_details_diagnostic.json
          retention-days: 7
          if-no-files-found: warn
