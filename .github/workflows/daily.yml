name: Daily football AI production

on:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'index.html'
      - '.github/workflows/daily.yml'
  schedule:
    # Taiwan 16:00, 17:00 and 18:00. Later retries are skipped if today's verified analysis exists.
    - cron: '0 8,9,10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-football-production
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify parser safety checks
        run: python -m unittest discover -s tests -v
      - name: Install free headless browser fallback
        run: |
          python -m pip install --quiet playwright
          if ! command -v google-chrome >/dev/null && ! command -v chromium >/dev/null; then
            python -m playwright install chromium
          fi
      - name: Collect Titan007 and generate Gemini analysis when verified
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/daily.py
      - name: Publish outcomes for the phone-friendly dashboard
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d output ]; then
            git add -A output/
            if ! git diff --cached --quiet; then
              git commit -m "Update football fixtures, verified picks and feed status"
              git push
            fi
          fi
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-football-output
          path: output/
          retention-days: 7
          if-no-files-found: ignore
